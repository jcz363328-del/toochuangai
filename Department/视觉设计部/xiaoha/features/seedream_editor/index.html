<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;color:#dce4f8;background:transparent;font:13px system-ui,sans-serif}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}button{border:1px solid #394766;background:#15223b;border-radius:7px;color:inherit;padding:7px 11px;cursor:pointer}button.active{background:#6952c4;border-color:#a792ff}button:disabled{opacity:.4;cursor:default}.stage{padding:8px;border:1px solid #36425e;border-radius:10px;background:#0c1528;text-align:center}canvas{display:block;max-width:100%;margin:auto;touch-action:none;cursor:crosshair}p{margin:8px 0;color:#9eacc8;line-height:1.5}.status{color:#d4c7ff;min-height:20px}
</style></head><body>
<div class="toolbar" id="tools"></div>
<div class="stage"><canvas id="canvas" width="600" height="300" aria-label="在图片上点选、框选或绘制标记"></canvas></div>
<p id="help">加载图片中…</p><p class="status" id="status" aria-live="polite"></p>
<script>
(() => {
 const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), toolbar=document.getElementById('tools');
 let source=new Image(), mode='coordinates', signature='', marks=[], pending=null, tool='rect', disabled=false;
 const send=(type,data={})=>window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');
 const height=()=>send('streamlit:setFrameHeight',{height:document.documentElement.scrollHeight});
 const status=text=>document.getElementById('status').textContent=text;
 function commit(){send('streamlit:setComponentValue',{value:{marks:marks,signature},dataType:'json'});status(`已保存 ${marks.length} 个标记`);render();}
 function point(event){const r=canvas.getBoundingClientRect();return [Math.min(999,Math.max(0,Math.round((event.clientX-r.left)/r.width*1000))),Math.min(999,Math.max(0,Math.round((event.clientY-r.top)/r.height*1000)))];}
 function path(mark,index){
  const pts=mark.points.map(([x,y])=>[x/1000*canvas.width,y/1000*canvas.height]);
  ctx.strokeStyle='#ff3030';ctx.fillStyle='#ff3030';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  const [x,y]=pts[0], last=pts[pts.length-1];
  if(mark.type==='rect'){ctx.strokeRect(Math.min(x,last[0]),Math.min(y,last[1]),Math.abs(last[0]-x),Math.abs(last[1]-y));}
  else if(mark.type==='ellipse'){ctx.ellipse((x+last[0])/2,(y+last[1])/2,Math.abs(last[0]-x)/2,Math.abs(last[1]-y)/2,0,0,Math.PI*2);ctx.stroke();}
  else if(mark.type==='point'){ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();}
  else {ctx.moveTo(x,y);pts.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();if(mark.type==='arrow'&&pts.length>1){let a=Math.atan2(last[1]-y,last[0]-x);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(last[0]-15*Math.cos(a-.5),last[1]-15*Math.sin(a-.5));ctx.lineTo(last[0]-15*Math.cos(a+.5),last[1]-15*Math.sin(a+.5));ctx.closePath();ctx.fill();}}
  const lx=Math.max(0,Math.min(canvas.width-24,mark.type==='arrow'?last[0]:x)),ly=Math.max(18,Math.min(canvas.height,mark.type==='arrow'?last[1]:y));
  ctx.fillStyle='#ffe468';ctx.fillRect(lx,ly-18,24,18);ctx.fillStyle='#111';ctx.font='bold 12px sans-serif';ctx.fillText(String(index+1),lx+5,ly-4);
 }
 function render(){ctx.clearRect(0,0,canvas.width,canvas.height);if(source.complete&&source.naturalWidth)ctx.drawImage(source,0,0,canvas.width,canvas.height);marks.forEach(path);if(pending)path(pending,marks.length);}
 function buttons(){toolbar.replaceChildren();const tools=mode==='coordinates'?[['point','点选'],['rect','框选']]:[['arrow','箭头'],['rect','框线'],['ellipse','圈选'],['brush','画笔'],['point','点选']];for(const [value,label] of tools){const b=document.createElement('button');b.textContent=label;b.className=tool===value?'active':'';b.disabled=disabled;b.onclick=()=>{tool=value;buttons()};toolbar.append(b);}for(const [label,action]of [['撤销',()=>{marks.pop();commit()}],['清空',()=>{marks=[];commit()}]]){const b=document.createElement('button');b.textContent=label;b.disabled=disabled||!marks.length;b.onclick=()=>{action();buttons()};toolbar.append(b);}}
 canvas.addEventListener('pointerdown',event=>{if(disabled||!source.naturalWidth)return;if(marks.length>=40){status('最多添加 40 个标记');return;}canvas.setPointerCapture(event.pointerId);const p=point(event);pending={type:tool,points:tool==='point'?[p]:[p,p]};render();});
 canvas.addEventListener('pointermove',event=>{if(!pending)return;const p=point(event);if(tool==='brush'){if(pending.points.length<2000)pending.points.push(p);}else if(tool!=='point')pending.points[1]=p;render();});
 canvas.addEventListener('pointerup',()=>{if(!pending)return;const points=pending.points;if(pending.type!=='point'&&pending.type!=='brush'&&Math.hypot(points[1][0]-points[0][0],points[1][1]-points[0][1])<4){pending=null;render();return;}marks.push(pending);pending=null;commit();buttons();});
 canvas.addEventListener('pointercancel',()=>{pending=null;render();});
 window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data.type!=='streamlit:render')return;const args=event.data.args||{};disabled=Boolean(event.data.disabled);mode=args.mode||'coordinates';
  if(signature!==args.signature){signature=args.signature;marks=Array.isArray(args.initial_marks)?args.initial_marks:[];pending=null;tool=mode==='coordinates'?'rect':'arrow';source=new Image();source.onload=()=>{const scale=Math.min(1,640/source.naturalWidth,520/source.naturalHeight);canvas.width=Math.max(1,Math.round(source.naturalWidth*scale));canvas.height=Math.max(1,Math.round(source.naturalHeight*scale));canvas.style.width=canvas.width+'px';render();height()};source.onerror=()=>status('图片加载失败，请重新上传');source.src=args.image;}
  document.getElementById('help').textContent=mode==='coordinates'?'点选或拖出框选区域；自动换算为 0–999 坐标。标记完成后自动保存。':'选择工具，在图片上绘制箭头、框线、圈选或笔画；完成后自动保存。';buttons();height();
 });
 new ResizeObserver(height).observe(document.body);
 send('streamlit:componentReady',{apiVersion:1});height();
})();
</script></body></html>
