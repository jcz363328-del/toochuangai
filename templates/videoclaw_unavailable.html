<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VideoClaw 正在启动</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Microsoft YaHei,Arial,sans-serif;color:#1f2937}
        .box{max-width:520px;margin:24px;padding:32px;border-radius:18px;background:#fff;box-shadow:0 12px 40px #1f29371a;text-align:center}
        a{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:999px;background:#2563eb;color:#fff;text-decoration:none}
        code{font-size:12px;color:#64748b}
    </style>
</head>
<body>
<main class="box">
    <h1>VideoClaw 正在启动</h1>
    <p>{{ message }}</p>
    <p><code>{{ frontend_url }}</code></p>
    <a href="{{ url_for('video_claw') }}">重新打开</a>
</main>
</body>
</html>
