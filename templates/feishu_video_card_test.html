<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频推送</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;background:#f5f3ff;color:#241d33}.shell{max-width:920px;margin:0 auto;padding:32px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.top a{color:#6d28d9;text-decoration:none;font-weight:700}.card{background:#fff;border:1px solid #ddd6fe;border-radius:18px;box-shadow:0 18px 50px rgba(76,29,149,.1);overflow:hidden}.hero{padding:26px 30px;background:linear-gradient(135deg,#6d28d9,#db2777);color:#fff}.hero h1{margin:0 0 8px;font-size:26px}.hero p{margin:0;opacity:.9;line-height:1.6}.body{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:28px 30px}.form{display:grid;gap:17px}.field{display:grid;gap:7px}.field span{font-size:13px;font-weight:800}.field small{color:#756b83;line-height:1.45}.field input,.field select,.field textarea{width:100%;border:1px solid #d8d1e4;border-radius:10px;padding:11px 12px;font:inherit;background:#fff}.field textarea{resize:vertical}.recipient{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px}.upload{padding:18px;border:1px dashed #a78bfa;border-radius:12px;background:#faf8ff}.send{min-height:46px;border:0;border-radius:11px;background:linear-gradient(135deg,#6d28d9,#db2777);color:#fff;font-weight:800;cursor:pointer}.send:disabled{opacity:.6;cursor:wait}.status{display:none;padding:15px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.status.show{display:block}.status.ok{background:#ecfdf5;color:#166534;border:1px solid #86efac}.status.error{background:#fff1f2;color:#9f1239;border:1px solid #fda4af}.details{margin-top:8px;font-family:Consolas,monospace;font-size:11px}@media(max-width:760px){.recipient{grid-template-columns:1fr}.hero,.body{padding:22px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><strong>人力行政部 · 视频推送</strong><a href="{{ url_for('hr_admin_modules') }}">← 返回人力行政部功能</a></div>
    <section class="card">
      <header class="hero"><h1>视频推送</h1><p>上传 MP4 视频并推送到飞书，接收方可直接查看并播放。</p></header>
      <div class="body">
        <form id="videoCardForm" class="form">
          <label class="field"><span>接收目标</span><div class="recipient"><select name="receive_id_type" id="receiveType"><option value="open_id">发送给自己</option><option value="chat_id">群聊名称</option></select><select name="receive_id" id="receiveId"><option value="{{ current_open_id }}">{{ current_user_name }}（自己）</option></select></div><small id="recipientHelp">当前登录用户：{{ current_user_name }}。选择“群聊名称”后会直接展示机器人已加入的群聊。</small></label>
          <label class="field"><span>消息标题</span><input name="title" value="视频推送" maxlength="80"></label>
          <label class="field"><span>说明文字</span><textarea name="description" rows="4" maxlength="1000">用于验证飞书消息卡片中的视频播放能力。</textarea></label>
          <label class="field upload"><span>MP4 视频</span><input name="video" id="videoFile" type="file" accept="video/mp4,.mp4" required><small>仅支持 MP4，飞书原生视频消息约支持 30 MB 以内。</small></label>
          <button class="send" id="sendButton" type="submit">上传并推送视频</button>
          <div id="status" class="status" role="status"></div>
        </form>
      </div>
    </section>
  </main>
  <script>
    const form=document.getElementById('videoCardForm');const button=document.getElementById('sendButton');const statusBox=document.getElementById('status');const receiveType=document.getElementById('receiveType');const receiveId=document.getElementById('receiveId');const recipientHelp=document.getElementById('recipientHelp');const currentOpenId={{ current_open_id|tojson }};const currentUserName={{ current_user_name|tojson }};
    receiveType.addEventListener('change',async()=>{if(receiveType.value!=='chat_id'){receiveId.innerHTML='';receiveId.add(new Option(`${currentUserName}（自己）`,currentOpenId));recipientHelp.textContent=`当前登录用户：${currentUserName}。`;return}receiveId.innerHTML='';receiveId.add(new Option('正在加载已加入的群聊…',''));receiveId.disabled=true;recipientHelp.textContent='正在读取机器人已加入的群聊…';try{const response=await fetch('{{ url_for("feishu_video_card_test_chats") }}');const result=await response.json();receiveId.innerHTML='';if(!response.ok||!result.success)throw new Error(result.message||'群聊加载失败');if(!result.chats.length){receiveId.add(new Option('暂无可用群聊',''));recipientHelp.textContent='机器人目前没有加入任何可见群聊。';return}receiveId.add(new Option(`请选择群聊（共 ${result.chats.length} 个）`,''));result.chats.forEach(chat=>receiveId.add(new Option(chat.name,chat.chat_id)));recipientHelp.textContent=`已加载 ${result.chats.length} 个群聊，直接选择后发送。`}catch(error){receiveId.innerHTML='';receiveId.add(new Option('群聊加载失败',''));recipientHelp.textContent=error.message}finally{receiveId.disabled=false}});
    form.addEventListener('submit',async(event)=>{event.preventDefault();const file=document.getElementById('videoFile').files[0];if(!file)return;if(file.size>30000000){show(false,'飞书原生视频消息约支持 30 MB 以内，请压缩视频后再发送');return}button.disabled=true;button.textContent='正在上传并推送…';statusBox.className='status';try{const response=await fetch('{{ url_for("feishu_video_card_test_send") }}',{method:'POST',body:new FormData(form)});const raw=await response.text();let result;try{result=JSON.parse(raw)}catch(_){throw Error(`服务器返回了非 JSON 错误（HTTP ${response.status}）：${raw.slice(0,160)}`)}const details=[result.mode&&`发送模式：${result.mode}`,result.file_key&&`file_key：${result.file_key}`,result.message_id&&`message_id：${result.message_id}`].filter(Boolean).join('\n');show(response.ok&&result.success,`${result.message||'请求完成'}${details?'\n\n'+details:''}`)}catch(error){show(false,`请求失败：${error.message}`)}finally{button.disabled=false;button.textContent='上传并推送视频'}});
    function show(ok,text){statusBox.className=`status show ${ok?'ok':'error'}`;statusBox.textContent=text}
  </script>
</body>
</html>
