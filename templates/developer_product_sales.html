<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我开发的产品销售</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:"Microsoft YaHei",Arial,sans-serif}header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}.bar,main{width:min(1400px,calc(100% - 28px));margin:auto}.bar{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}.bar h1{font-size:19px;margin:0}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:8px;padding:7px 12px}.filters,.metric,.panel{background:#fff;border:1px solid #e2e8f2;border-radius:14px;box-shadow:0 5px 20px #26365d0d}.identity{font-size:13px;opacity:.9}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:14px;padding:18px;margin:18px 0}.field{display:grid;gap:6px}.field label,.status,.note{font-size:13px;color:#64748b}.field input{height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font:inherit}.run{height:40px;border:0;border-radius:8px;padding:0 24px;color:#fff;background:#4f46e5;font-weight:700;cursor:pointer}.run:disabled{opacity:.55}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.metric{padding:16px}.metric span{display:block;color:#64748b;font-size:13px;margin-bottom:7px}.metric strong{font-size:24px;font-variant-numeric:tabular-nums}.progress{height:8px;background:#e9edf5;border-radius:999px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#8b5cf6);transition:width .25s}.panel{padding:18px;margin-bottom:22px}.panel h2{font-size:16px;margin:0 0 14px}.chart{height:260px;position:relative}.chart canvas{width:100%;height:100%}.table-wrap{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;font-size:13px}th{position:sticky;top:0;background:#f8fafc;color:#475569;text-align:right}th:first-child,td:first-child{text-align:left}th,td{padding:10px 12px;border-bottom:1px solid #edf1f7;white-space:nowrap}td{text-align:right;font-variant-numeric:tabular-nums}.empty{text-align:center!important;color:#94a3b8;padding:32px!important}@media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.field,.field input,.run{width:100%}.summary{grid-template-columns:1fr}.bar{align-items:flex-start;padding:12px 0}.identity{display:block}}
</style></head><body>
<header><div class="bar"><div><h1>我开发的产品销售</h1><span class="identity">当前开发人：{{ developer or '未识别' }}</span></div><a class="back" href="{{ url_for('ai_modules') }}">返回 AI 部功能</a></div></header>
<main><section class="filters"><div class="field"><label for="store">店铺号</label><input id="store" type="number" min="1" step="1" inputmode="numeric" placeholder="请输入店铺号" autocomplete="off"></div><div class="field"><label for="start">开始日期</label><input id="start" type="date" value="{{ default_start }}" max="{{ default_end }}"></div><div class="field"><label for="end">结束日期</label><input id="end" type="date" value="{{ default_end }}" max="{{ default_end }}"></div><button id="run" class="run" type="button">查询</button><span id="status" class="status">请输入店铺号后查询</span></section>
<section class="summary"><div class="metric"><span>区间销售额</span><strong id="sales">--</strong></div><div class="metric"><span>区间毛利润</span><strong id="profit">--</strong></div><div class="metric"><span>区间毛利率</span><strong id="margin">--</strong></div><div class="metric"><span id="cumulativeLabel">累计销售额</span><strong id="cumulative">--</strong><div class="progress"><i id="progressBar"></i></div><div id="progressText" class="note"></div></div></section>
<section class="panel"><h2>每日销售与毛利润</h2><div class="chart"><canvas id="chart"></canvas></div></section>
<section class="panel"><h2>每日明细</h2><div class="table-wrap"><table><thead><tr><th>日期</th><th>销售额</th><th>毛利润</th><th>毛利率</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">请选择日期后查询</td></tr></tbody></table></div></section>
</main><script>
const $=id=>document.getElementById(id);let result=null;const money=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const pct=n=>n==null?'--':(Number(n)*100).toFixed(2)+'%';
function draw(){if(!result)return;const c=$('chart'),box=c.parentElement,r=devicePixelRatio||1,w=box.clientWidth,h=box.clientHeight;c.width=w*r;c.height=h*r;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.scale(r,r);x.clearRect(0,0,w,h);const p={l:68,r:22,t:18,b:42},cw=w-p.l-p.r,ch=h-p.t-p.b,d=result.daily;if(!d.length){x.fillStyle='#94a3b8';x.fillText('当前时间段暂无数据',p.l,p.t+30);return}const max=Math.max(1,...d.flatMap(v=>[v.sales,Math.max(0,v.profit)]));x.font='12px Arial';for(let i=0;i<=4;i++){const y=p.t+ch*i/4;x.strokeStyle='#e7ebf3';x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillStyle='#64748b';x.fillText(money(max*(1-i/4)),2,y+4)}const px=i=>p.l+(d.length===1?cw/2:cw*i/(d.length-1)),py=v=>p.t+ch*(1-v/max);[['sales','#4f46e5'],['profit','#10b981']].forEach(([key,color])=>{x.beginPath();d.forEach((v,i)=>i?x.lineTo(px(i),py(v[key])):x.moveTo(px(i),py(v[key])));x.strokeStyle=color;x.lineWidth=2.2;x.stroke()});const ticks=Math.min(8,d.length);x.fillStyle='#64748b';x.textAlign='center';for(let i=0;i<ticks;i++){const j=Math.round(i*(d.length-1)/Math.max(1,ticks-1));x.fillText(d[j].date.slice(5),px(j),h-17)}x.textAlign='start'}
async function load(){const store=$('store').value.trim(),start=$('start').value,end=$('end').value;if(!/^\d+$/.test(store)||Number(store)<1){$('status').textContent='请输入有效的店铺号';return}if(!start||!end){$('status').textContent='请选择完整日期范围';return}$('run').disabled=true;$('status').textContent='正在查询...';try{const res=await fetch('/api/ai/developer-product-sales?'+new URLSearchParams({store,start,end})),json=await res.json();if(!res.ok||!json.success)throw Error(json.message||'查询失败');result=json.data;$('sales').textContent=money(result.sales);$('profit').textContent=money(result.profit);$('margin').textContent=pct(result.margin);$('cumulative').textContent=money(result.cumulative_sales);$('cumulativeLabel').textContent=`${result.cumulative_start} 起累计销售额`;$('progressText').textContent=`${result.store} 号店 · 50 万目标进度：${pct(result.progress)}`;$('progressBar').style.width=Math.min(100,Math.max(0,result.progress*100))+'%';$('rows').innerHTML=result.daily.length?result.daily.map(v=>`<tr><td>${v.date}</td><td>${money(v.sales)}</td><td>${money(v.profit)}</td><td>${pct(v.margin)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">当前时间段暂无数据</td></tr>';draw();$('status').textContent=`${result.store} 号店已加载 ${result.daily.length} 天数据`}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}}
$('run').onclick=load;$('store').addEventListener('keydown',event=>{if(event.key==='Enter')load()});window.addEventListener('resize',()=>requestAnimationFrame(draw));
</script></body></html>
