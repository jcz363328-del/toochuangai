*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:"Microsoft YaHei",Arial,sans-serif}header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}.bar,main{width:min(1440px,calc(100% - 28px));margin:auto}.bar{height:58px;display:flex;align-items:center;justify-content:space-between}.bar h1{font-size:19px;margin:0}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:8px;padding:7px 12px}.filters,.panel,.metric{background:#fff;border:1px solid #e2e8f2;border-radius:14px;box-shadow:0 5px 20px #26365d0d}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:14px;padding:18px;margin:18px 0}.field{display:grid;gap:6px}.field label{font-size:13px;color:#64748b}.field input{height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font:inherit}.run{height:40px;border:0;border-radius:8px;padding:0 24px;color:#fff;background:#4f46e5;font-weight:700;cursor:pointer}.run:disabled{opacity:.55}.status,.period,.source{font-size:12px;color:#64748b}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.metric{padding:16px}.metric span{display:block;color:#64748b;font-size:13px;margin-bottom:7px}.metric strong{font-size:24px;font-variant-numeric:tabular-nums}.charts{display:grid;gap:14px}.panel{padding:18px}.panel-title{display:flex;align-items:center;justify-content:space-between}.panel-title h2{font-size:16px;margin:0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.chart-wrap{position:relative;height:330px}.chart-wrap canvas{width:100%;height:100%}.hint{text-align:center;color:#94a3b8;padding:110px 10px}.source{margin:12px 2px 24px;color:#94a3b8}@media(max-width:650px){.field,.field input,.run{width:100%}.summary{grid-template-columns:1fr}.chart-wrap{height:300px}.panel-title{align-items:flex-start;gap:6px;flex-direction:column}}

<script>
const $=id=>document.getElementById(id);let chartData=null;
const money=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function drawOne(canvasId,key,dateKey,color){if(!chartData)return;const c=$(canvasId),box=c.parentElement,r=window.devicePixelRatio||1,w=box.clientWidth,h=box.clientHeight;c.width=w*r;c.height=h*r;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.scale(r,r);x.clearRect(0,0,w,h);const p={l:72,r:24,t:20,b:50},cw=w-p.l-p.r,ch=h-p.t-p.b,pts=chartData.points,max=Math.max(1,...pts.map(v=>v[key]));x.font='12px Arial';x.fillStyle='#64748b';x.strokeStyle='#e7ebf3';x.lineWidth=1;for(let i=0;i<=5;i++){const y=p.t+ch*i/5,val=max*(1-i/5);x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();x.fillText(money(val),4,y+4)}const px=i=>p.l+(pts.length===1?cw/2:cw*i/(pts.length-1)),py=v=>p.t+ch*(1-v/max);x.beginPath();pts.forEach((v,i)=>{const a=px(i),b=py(v[key]);i?x.lineTo(a,b):x.moveTo(a,b)});x.strokeStyle=color;x.lineWidth=2.5;x.lineJoin='round';x.stroke();const ticks=Math.min(8,pts.length);for(let i=0;i<ticks;i++){const idx=Math.round(i*(pts.length-1)/Math.max(1,ticks-1));x.fillStyle='#64748b';x.textAlign='center';x.fillText(pts[idx][dateKey].slice(5),px(idx),h-20)}x.textAlign='start'}
function draw(){drawOne('currentChart','current','date','#4f46e5');drawOne('previousChart','previous','previous_date','#f59e0b')}
async function load(){const start=$('start').value,end=$('end').value;if(!start||!end){$('status').textContent='\u8bf7\u9009\u62e9\u5b8c\u6574\u65e5\u671f\u8303\u56f4';return}$('run').disabled=true;$('status').textContent='\u6b63\u5728\u67e5\u8be2...';try{const res=await fetch('/api/ai/historical-sales?'+new URLSearchParams({start,end})),json=await res.json();if(!res.ok||!json.success)throw Error(json.message||'\u67e5\u8be2\u5931\u8d25');chartData=json.data;$('currentLabel').textContent=`\u5f53\u524d\u65f6\u6bb5\uff08${chartData.start} \u81f3 ${chartData.end}\uff09`;$('previousLabel').textContent=`\u53bb\u5e74\u540c\u671f\uff08${chartData.previous_start} \u81f3 ${chartData.previous_end}\uff09`;$('currentPeriod').textContent=`${chartData.start} \u81f3 ${chartData.end}`;$('previousPeriod').textContent=`${chartData.previous_start} \u81f3 ${chartData.previous_end}`;$('currentTotal').textContent=money(chartData.current_total);$('previousTotal').textContent=money(chartData.previous_total);$('growth').textContent=chartData.growth===null?'--':(chartData.growth*100).toFixed(2)+'%';$('growth').style.color=chartData.growth>=0?'#059669':'#dc2626';$('hint').style.display='none';draw();$('status').textContent=`\u5df2\u52a0\u8f7d ${chartData.points.length} \u5929\u6570\u636e`}catch(e){$('status').textContent=e.message;$('hint').style.display='block';$('hint').textContent='\u6570\u636e\u52a0\u8f7d\u5931\u8d25\uff1a'+e.message}finally{$('run').disabled=false}}
$('run').onclick=load;window.addEventListener('resize',()=>requestAnimationFrame(draw));
</script></body></html>
