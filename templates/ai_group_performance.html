<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>组别经营数据 - 图创AI系统</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font-family:"Microsoft YaHei",Arial,sans-serif}header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}.bar,main{width:min(1600px,calc(100% - 28px));margin:auto}.bar{min-height:56px;display:flex;align-items:center;justify-content:space-between}.bar h1{font-size:20px;margin:0}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:8px;padding:7px 12px}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:14px;padding:18px;margin:18px 0;background:#fff;border-radius:12px;box-shadow:0 5px 20px #26365d12}.field{display:grid;gap:6px}.field label{font-size:13px;color:#536078}.field input,.field select{height:40px;min-width:190px;border:1px solid #ccd4e0;border-radius:8px;padding:0 10px;background:#fff;font-size:14px}.run{height:40px;border:0;border-radius:8px;padding:0 24px;color:#fff;background:#4f46e5;font-weight:700;cursor:pointer}.run:disabled{opacity:.55}.status{font-size:13px;color:#68758a}.tabs{display:flex;gap:8px;margin-bottom:10px}.tab{border:1px solid #d5dceb;background:#fff;border-radius:8px;padding:8px 16px;cursor:pointer}.tab.active{color:#fff;background:#4f46e5;border-color:#4f46e5}.panel{background:#fff;border:1px solid #dae0eb;border-radius:12px;overflow:hidden}.table-wrap{overflow:auto;max-height:calc(100vh - 255px)}table{width:100%;min-width:1050px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th,td{padding:9px 11px;border-bottom:1px solid #e8ecf3;white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#283750;color:#fff}th:nth-child(-n+4),td:nth-child(-n+4){text-align:left}tbody tr:nth-child(even){background:#fafbfe}.empty{padding:60px 20px;text-align:center;color:#7a869a}@media(max-width:650px){.field,.field input,.field select,.run{width:100%}.table-wrap{max-height:none}}
</style></head><body>
<header><div class="bar"><h1>组别经营数据</h1><a class="back" href="{{ url_for('ai_modules') }}">返回 AI 功能</a></div></header>
<main><section class="filters">
<div class="field"><label for="month">统计月份（自动对比上月）</label><input id="month" type="month" value="{{ default_month }}"></div>
<div class="field"><label for="group">组别</label><select id="group"><option value="">正在加载组别…</option></select></div>
<button id="run" class="run" type="button">执行查询</button><span id="status" class="status"></span>
</section>
<div class="tabs"><button class="tab active" data-view="summary">店铺汇总</button><button class="tab" data-view="detail">店铺 × 站点明细</button></div>
<section class="panel"><div id="result" class="empty">请选择月份和组别后执行查询</div></section></main>
<script>
const el=id=>document.getElementById(id), state={data:null,view:'summary'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function format(v,col){if(v===null||v===undefined)return '—';if(/率|比重/.test(col)){const n=Number(v);return Number.isFinite(n)?(n*100).toFixed(2)+'%':esc(v)}if(/销售额|目标|毛利润/.test(col)){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v)}return esc(v)}
function render(){const d=state.data&&state.data[state.view];if(!d||!d.rows.length){el('result').className='empty';el('result').innerHTML='当前条件没有返回数据';return}el('result').className='table-wrap';el('result').innerHTML='<table><thead><tr>'+d.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+d.rows.map(r=>'<tr>'+d.columns.map((c,i)=>'<td>'+format(r[i],c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
async function loadGroups(){try{const r=await fetch('/api/ai/group-performance/groups'),d=await r.json();if(!r.ok||!d.success)throw Error(d.message);el('group').innerHTML='<option value="">请选择组别</option>'+d.groups.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('')}catch(e){el('group').innerHTML='<option value="">组别加载失败</option>';el('status').textContent=e.message}}
el('run').onclick=async()=>{const month=el('month').value,group=el('group').value;if(!month||!group){el('status').textContent='请选择月份和组别';return}el('run').disabled=true;el('status').textContent='正在查询…';try{const r=await fetch('/api/ai/group-performance/query?'+new URLSearchParams({month,group})),d=await r.json();if(!r.ok||!d.success)throw Error(d.message);state.data=d;render();el('status').textContent='查询完成：'+group+' / '+month}catch(e){el('status').textContent=e.message;el('result').className='empty';el('result').textContent='查询未完成'}finally{el('run').disabled=false}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.view=b.dataset.view;render()});loadGroups();
</script></body></html>
