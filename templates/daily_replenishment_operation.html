<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日常补货运营 - 图创AI系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box}body{margin:0;color:#172033;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:linear-gradient(160deg,#f8fafc,#eef2ff);min-height:100vh}
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:15px 28px;color:#fff;background:linear-gradient(125deg,#1e3a8a,#4f46e5,#7c3aed);box-shadow:0 8px 24px #312e8138}.brand{display:flex;align-items:center;gap:12px}.brand h1{margin:0;font-size:20px}.brand span{display:block;color:#ddd6fe;font-size:12px;margin-top:3px}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:999px;padding:8px 14px}
        main{padding:18px 12px 32px}.panel{background:#fffffff2;border:1px solid #cbd5e1;border-radius:18px;box-shadow:0 14px 34px #1e293b14;margin-bottom:14px}.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px}.hero h2{margin:0 0 7px}.hero p{margin:0;color:#64748b;line-height:1.7}.badge{white-space:nowrap;background:#ede9fe;color:#5b21b6;padding:10px 14px;border-radius:12px;font-weight:700}
        .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px}.button,.upload{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;text-decoration:none}.button{color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed)}.download{background:#0f766e}.upload{background:#eef2ff;color:#3730a3}input[type=file]{display:none}.search{min-width:240px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px}.status{color:#64748b}.status.error{color:#b91c1c}.status.success{color:#047857}
        .tabs{display:flex;gap:8px;overflow:auto;padding:12px}.tab{white-space:nowrap;border:1px solid #dbe3f0;background:#fff;color:#475569;padding:9px 14px;border-radius:999px;font-weight:700;cursor:pointer}.tab.active{color:#fff;border-color:#4f46e5;background:linear-gradient(135deg,#4f46e5,#7c3aed)}
        .table-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e2e8f0}.purpose{color:#64748b;font-size:12px}.wrap{overflow:auto;max-height:calc(100vh - 330px);min-height:360px}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}th{position:sticky;top:0;z-index:2;background:#312e81;color:#fff;padding:10px;white-space:nowrap}td{position:relative;padding:8px 10px;border-bottom:1px solid #e5e7eb;white-space:nowrap}td.has-comment::after{content:"";position:absolute;right:1px;top:1px;border-top:7px solid #ef4444;border-left:7px solid transparent}tbody tr:hover{background:#eef2ff}.empty{padding:80px;text-align:center;color:#94a3b8}.fast-tooltip{position:fixed;z-index:9999;max-width:440px;white-space:pre-wrap;padding:10px 12px;border-radius:9px;background:#172033;color:#fff;font-size:12px;line-height:1.55;box-shadow:0 10px 28px #0f172a55;pointer-events:none}.fast-tooltip[hidden]{display:none!important}
        @media(max-width:760px){.hero{align-items:flex-start;flex-direction:column}.search{width:100%}.wrap{max-height:calc(100vh - 400px)}}
    </style>
</head>
<body>
<header class="topbar"><div class="brand"><i class="fas fa-boxes-packing"></i><div><h1>日常补货运营</h1><span>运营版完整多表刷新</span></div></div><a class="back" href="{{ url_for('ai_modules') }}"><i class="fas fa-arrow-left"></i> 返回AI部功能</a></header>
<main>
    <section class="panel hero"><div><h2>生成日常补货表</h2><p>独立复制原《日常补货-运营》按钮调用链，一次同步库存、在途、FBA发货、每日库存、海运到货及低毛利率筛选。</p></div><div class="badge">7 个工作表同步</div></section>
    <section class="panel toolbar">
        {% if can_write %}<label class="upload" for="file"><i class="fas fa-file-excel"></i> 运营版参数表（可选）</label><input id="file" type="file" accept=".xlsx,.xlsm"><span id="fileName" class="status">使用默认参数</span>
        <button id="refresh" class="button" type="button"><i class="fas fa-rotate"></i> 生成/刷新</button>{% else %}<span class="status">当前为只读权限</span>{% endif %}
        <a id="download" class="button download" href="{{ url_for('daily_replenishment_operation.download') }}"{% if not snapshot.available or snapshot.download_available is sameas false %} hidden{% endif %}><i class="fas fa-download"></i> 下载完整工作簿</a>
        <input id="search" class="search" type="search" placeholder="搜索当前工作表">
        <span id="status" class="status">{% if snapshot.available %}今日快照：{{ snapshot.modified_at }}{% else %}今日尚未生成{% endif %}</span>
    </section>
    <section class="panel"><div id="tabs" class="tabs"></div><div class="table-head"><strong id="count">尚未载入</strong><span id="purpose" class="purpose"></span></div><div id="wrap" class="wrap"><div class="empty">点击“生成/刷新”执行运营版完整功能。</div></div></section>
</main>
<div id="fastTooltip" class="fast-tooltip" role="tooltip" hidden></div>
<script>
const initial={{ snapshot|tojson }};const initialData={{ initial_data|tojson }};const order=['库存明细','在途','日常补货','FBA发货','每日库存','海运即将到货','低毛利率'];const state={sheets:{},active:'日常补货'};
const e={file:document.getElementById('file'),fileName:document.getElementById('fileName'),refresh:document.getElementById('refresh'),download:document.getElementById('download'),search:document.getElementById('search'),status:document.getElementById('status'),tabs:document.getElementById('tabs'),count:document.getElementById('count'),purpose:document.getElementById('purpose'),wrap:document.getElementById('wrap'),tooltip:document.getElementById('fastTooltip')};
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function setStatus(text,type=''){e.status.textContent=text;e.status.className='status '+type}
function renderTabs(){const names=order.filter(n=>state.sheets[n]);if(!state.sheets[state.active])state.active=names[0]||'日常补货';e.tabs.innerHTML=names.map(n=>`<button class="tab${n===state.active?' active':''}" data-name="${esc(n)}">${esc(n)}</button>`).join('')}
function render(){const s=state.sheets[state.active]||{columns:[],rows:[]};const q=e.search.value.trim().toLowerCase();const indexed=(s.rows||[]).map((row,index)=>({row,index}));const rows=indexed.filter(x=>!q||x.row.map(v=>String(v??'')).join('\n').toLowerCase().includes(q)||Object.values((s.comments||{})[x.index]||{}).join('\n').toLowerCase().includes(q));e.purpose.textContent=s.purpose||'';e.count.textContent=`${state.active}：${rows.length.toLocaleString('zh-CN')} / ${(s.rows||[]).length.toLocaleString('zh-CN')} 行`;const h=(s.columns||[]).map((v,i)=>{const note=String((s.header_comments||{})[i]||'').trim();return `<th${note?` data-tooltip="${esc(v+'\n\n原表批注：\n'+note)}"`:''}>${esc(v)}</th>`}).join('');const b=rows.map(x=>'<tr>'+(s.columns||[]).map((_,i)=>{const note=String(((s.comments||{})[x.index]||{})[i]||'').trim();const tip=note?` data-tooltip="${esc((s.columns||[])[i]+'：'+String(x.row[i]??'')+'\n\n原表批注：\n'+note)}"`:'';return `<td class="${note?'has-comment':''}"${tip}>${esc(x.row[i])}</td>`}).join('')+'</tr>').join('');e.wrap.innerHTML=rows.length?`<table><thead><tr>${h}</tr></thead><tbody>${b}</tbody></table>`:'<div class="empty">当前工作表无数据</div>'}
function showTooltip(target,event){const text=String(target?.dataset?.tooltip||'').trim();if(!text)return;e.tooltip.textContent=text;e.tooltip.hidden=false;moveTooltip(event)}
function moveTooltip(event){if(e.tooltip.hidden)return;const gap=14,margin=8,rect=e.tooltip.getBoundingClientRect();e.tooltip.style.left=Math.min(event.clientX+gap,window.innerWidth-rect.width-margin)+'px';e.tooltip.style.top=Math.min(event.clientY+gap,window.innerHeight-rect.height-margin)+'px'}
e.wrap.addEventListener('mouseover',event=>{const target=event.target.closest('[data-tooltip]');if(target)showTooltip(target,event)});e.wrap.addEventListener('mousemove',moveTooltip);e.wrap.addEventListener('mouseout',event=>{if(event.target.closest('[data-tooltip]'))e.tooltip.hidden=true});
function apply(data){state.sheets=data.sheets||{};renderTabs();render();e.download.hidden=false;const g=data.generation||{};setStatus((data.message||'数据已载入')+(g.sales_end?`，销量截止 ${g.sales_end}`:''),'success')}
async function load(){try{const r=await fetch('/api/ai/daily-replenishment-operation/data');const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'读取失败');apply(d)}catch(err){setStatus(err.message,'error')}}
async function refresh(){if(!confirm('确定刷新“日常补货运营”的全部 7 个工作表吗？'))return;e.refresh.disabled=true;e.refresh.innerHTML='<i class="fas fa-spinner fa-spin"></i> 刷新中';setStatus('正在同步所有工作表…');try{const f=new FormData();if(e.file.files[0])f.append('file',e.file.files[0]);const r=await fetch('/api/ai/daily-replenishment-operation/refresh',{method:'POST',body:f});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'刷新失败');apply(d)}catch(err){setStatus(err.message,'error')}finally{e.refresh.disabled=false;e.refresh.innerHTML='<i class="fas fa-rotate"></i> 生成/刷新'}}
if(e.file)e.file.addEventListener('change',()=>e.fileName.textContent=e.file.files[0]?.name||'使用默认参数');if(e.refresh)e.refresh.addEventListener('click',refresh);e.search.addEventListener('input',render);e.tabs.addEventListener('click',x=>{const b=x.target.closest('[data-name]');if(!b)return;state.active=b.dataset.name;renderTabs();render()});if(initialData&&initialData.success)apply(initialData);else if(initial.available)load();
</script>
</body></html>
