user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout main;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8000;
        client_max_body_size 512m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        location = /lashforge { return 302 /lashforge/; }
        location /lashforge/ {
            proxy_pass http://127.0.0.1:8501;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location = /infinite-canvas { return 302 /infinite-canvas/; }
        location /infinite-canvas/ { proxy_pass http://127.0.0.1:8502; }
        location /jimeng_uploads/ { proxy_pass http://127.0.0.1:8502; }
        location /history_images/ { proxy_pass http://127.0.0.1:8502; }
        location / { proxy_pass http://127.0.0.1:8100; }
    }
}
