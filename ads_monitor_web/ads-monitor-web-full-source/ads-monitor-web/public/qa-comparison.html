<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计对比 QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #20242b; color: #fff; font: 600 14px Inter, system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      figure { margin: 0; min-width: 0; }
      figcaption { margin: 0 0 10px 4px; }
      img { width: 100%; display: block; border: 1px solid #535a65; border-radius: 8px; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>参考设计（选项 3）</figcaption><img src="/qa/reference.png" alt="参考设计" /></figure>
      <figure><figcaption>当前实现（1440 × 1024）</figcaption><img src="/qa/implementation.png" alt="当前实现" /></figure>
    </main>
  </body>
</html>
