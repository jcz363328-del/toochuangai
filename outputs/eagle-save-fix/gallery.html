    <script>
      const images_eagle_test = [{"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aB1sAAAAASUVORK5CYII=", "full_src": "/original.png", "width": 1, "height": 1, "download_name": "eagle-original.png"}];

      function normalizeViewerSrc_eagle_test(src) {
        const raw = String(src || "").trim();
        if (!raw || raw.startsWith("data:")) {
          return raw;
        }
        try {
          const parsed = new URL(raw, hostWindow_eagle_test.location.href);
          const isStaticImageRoute =
            (parsed.hostname === hostWindow_eagle_test.location.hostname || ["xiaoha.test"].includes(parsed.hostname)) &&
            (parsed.pathname.startsWith("/history_images/") ||
            parsed.pathname.startsWith("/jimeng_uploads/"));
          if (!isStaticImageRoute) {
            return parsed.toString();
          }
          if (false) {
            return new URL(parsed.pathname + parsed.search + parsed.hash,
              hostWindow_eagle_test.location.origin).toString();
          }
          const currentProtocol = hostWindow_eagle_test.location.protocol || parsed.protocol;
          const currentHostname = hostWindow_eagle_test.location.hostname || parsed.hostname;
          const currentPort = parsed.port ? ":" + parsed.port : "";
          return `${currentProtocol}//${currentHostname}${currentPort}${parsed.pathname}${parsed.search}${parsed.hash}`;
        } catch (e) {
          return raw;
        }
      }

      function deriveEagleFileName_eagle_test(src, index) {
        const fallbackName = "eagle_test_" + String(index + 1) + ".png";
        const configuredName = String(
          (images_eagle_test[index] && images_eagle_test[index].download_name) || ""
        ).trim();
        if (configuredName) return configuredName;
        const raw = String(src || "").trim();
        if (!raw) return fallbackName;
        if (raw.startsWith("data:")) return fallbackName;
        try {
          const parsed = new URL(raw, hostWindow_eagle_test.location.href);
          const baseName = decodeURIComponent((parsed.pathname || "").split("/").pop() || "").trim();
          return baseName || fallbackName;
        } catch (e) {
          return fallbackName;
        }
      }

      async function downloadOriginal_eagle_test(src, name, saveAs = false) {
        const originalSrc = normalizeViewerSrc_eagle_test(src);
        const originalName = name || "original.png";
        const clickDownload = (href) => {
          const link = hostDoc_eagle_test.createElement("a");
          link.href = href;
          link.download = originalName;
          const viewer = hostDoc_eagle_test.getElementById("lashforge-fullscreen-viewer");
          const dialog = window.frameElement && window.frameElement.closest('dialog, [role="dialog"]');
          const linkHost = viewer && viewer.classList.contains("active") ? viewer : (dialog || hostDoc_eagle_test.body);
          linkHost.appendChild(link);
          link.click();
          link.remove();
        };
        try {
          if (!originalSrc) throw new Error("missing original");
          const parsed = new URL(originalSrc, hostWindow_eagle_test.location.href);
          const isStaticImageRoute =
            (parsed.hostname === hostWindow_eagle_test.location.hostname || ["xiaoha.test"].includes(parsed.hostname)) &&
            (parsed.pathname.startsWith("/history_images/") ||
            parsed.pathname.startsWith("/jimeng_uploads/"));
          const canSaveAs = saveAs && typeof hostWindow_eagle_test.showSaveFilePicker === "function";
          if (isStaticImageRoute && !canSaveAs) {
            // Let the server stream the original as an attachment. This stays
            // within the user's click and avoids CORS/blob and memory limits.
            parsed.searchParams.set("download", "1");
            parsed.searchParams.set("filename", originalName);
            clickDownload(parsed.toString());
            return;
          }
          // Open the picker before awaiting a network request: browsers require
          // the original user gesture, which a slow fetch would otherwise lose.
          const handle = canSaveAs
            ? await hostWindow_eagle_test.showSaveFilePicker({suggestedName: originalName})
            : null;
          const response = await hostWindow_eagle_test.fetch(originalSrc);
          if (!response.ok) throw new Error("original HTTP " + response.status);
          const blob = await response.blob();
          if (!blob.size || !blob.type.toLowerCase().startsWith("image/")) {
            throw new Error("invalid original image response");
          }
          if (handle) {
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            return;
          }
          const blobUrl = hostWindow_eagle_test.URL.createObjectURL(blob);
          clickDownload(blobUrl);
          hostWindow_eagle_test.setTimeout(() => hostWindow_eagle_test.URL.revokeObjectURL(blobUrl), 60000);
        } catch (error) {
          if (error && error.name === "AbortError") return;
          showEagleToast_eagle_test("原图下载失败，请刷新后重试；原文件可能已被移除。");
        }
      }

      async function eagleFetch_eagle_test(url, options) {
        const controller = new hostWindow_eagle_test.AbortController();
        const timeout = hostWindow_eagle_test.setTimeout(() => controller.abort(), 60000);
        try {
          return await hostWindow_eagle_test.fetch(url, {...options, signal: controller.signal});
        } finally {
          hostWindow_eagle_test.clearTimeout(timeout);
        }
      }

          hostDoc_eagle_test.head.appendChild(style);
        }
        const existingMenu = hostDoc_eagle_test.getElementById("lashforge-eagle-menu");
        if (existingMenu && existingMenu.dataset.version !== "20261124-2") existingMenu.remove();
        if (!hostDoc_eagle_test.getElementById("lashforge-eagle-menu")) {
          const menu = hostDoc_eagle_test.createElement("div");
          menu.id = "lashforge-eagle-menu";
          menu.dataset.version = "20261124-2";
          menu.innerHTML = ''
            + '<button type="button" id="lashforge-download-image">下载原图</button>'

            + '<button type="button" id="lashforge-save-to-eagle">保存到 Eagle</button>';
          uiHost.appendChild(menu);
          hostWindow_eagle_test.__lashforgeEagleMenuState = {};
          const hideMenu = () => {
            menu.style.display = "none";
          };
          hostDoc_eagle_test.addEventListener("click", hideMenu, true);
          hostDoc_eagle_test.addEventListener("scroll", hideMenu, true);
          hostWindow_eagle_test.addEventListener("blur", hideMenu);
          hostDoc_eagle_test.addEventListener("keydown", (event) => {
            if (event.key === "Escape") hideMenu();
          }, true);
          menu.querySelector("#lashforge-download-image").addEventListener("click", async () => {
            const state = hostWindow_eagle_test.__lashforgeEagleMenuState || {};
            hideMenu();
            await downloadOriginal_eagle_test(state.src, state.name);
          });
          menu.querySelector("#lashforge-save-as-image").addEventListener("click", async () => {
            const state = hostWindow_eagle_test.__lashforgeEagleMenuState || {};
            hideMenu();
            await downloadOriginal_eagle_test(state.src, state.name, true);
          });
          menu.querySelector("#lashforge-save-to-eagle").addEventListener("click", async () => {
            const state = hostWindow_eagle_test.__lashforgeEagleMenuState || {};
            hideMenu();
            if (!state.src) {
              return;
            }
            const saveButton = menu.querySelector("#lashforge-save-to-eagle");
            if (saveButton.disabled) return;
            saveButton.disabled = true;
            let stage = "connect";
            try {
              if (!hostWindow_eagle_test.isSecureContext) {
                showEagleToast_eagle_test("当前 HTTP 页面无法直连 Eagle。请放大原图后按 Alt + 右键，用 Eagle 浏览器扩展保存；也可下载原图后导入。", 12000);
                return;
              }
              showEagleToast_eagle_test("正在保存到 Eagle…");
              // Request local access while the click is still fresh, before
              // spending time loading a large original image.
              const info = await eagleFetch_eagle_test("http://localhost:41595/api/application/info", {
                targetAddressSpace: "loopback"
              });
              if (!info.ok) throw new Error("Eagle 连接失败（" + info.status + "）");
              stage = "image";
              // Read with the browser session: Eagle cannot resolve blob URLs or
              // access images protected by this site's login cookies.
              const imageResponse = await eagleFetch_eagle_test(state.src, {
                credentials: "same-origin"
              });
              if (!imageResponse.ok) throw new Error("原图读取失败（" + imageResponse.status + "）");
              const blob = await imageResponse.blob();
              if (!blob.size || !blob.type.startsWith("image/")) {
                throw new Error("原图不可用或登录已过期，请刷新页面后重试");
              }
              const imageData = await new Promise((resolve, reject) => {
                const reader = new hostWindow_eagle_test.FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("原图读取失败"));
                reader.readAsDataURL(blob);
              });
              stage = "eagle";
              // A plain-text JSON body matches Eagle's API example and avoids
              // the extra application/json CORS preflight on the local service.
              const response = await eagleFetch_eagle_test("http://localhost:41595/api/item/addFromURL", {
                method: "POST",
                targetAddressSpace: "loopback",
                body: JSON.stringify({
                  url: imageData,
                  name: state.name || "eagle_test.png",
                  website: hostWindow_eagle_test.location.href,
                  modificationTime: Date.now()
                })
              });
              stage = "response";
              const result = await response.json();
              if (!response.ok || !result || result.status !== "success") {
                throw new Error((result && (result.message || result.status)) || "Eagle 返回异常（" + response.status + "）");
              }
              showEagleToast_eagle_test("已保存到 Eagle");
            } catch (error) {
              let message = error && error.message ? error.message : "未知错误";
              if (stage === "eagle" || stage === "connect") {
                message = error && error.name === "AbortError"
                  ? "Eagle 响应超时，请先检查素材库是否已保存"
                  : "无法连接本机 Eagle，请确认已启动，并允许浏览器访问本地网络";
              } else if (stage === "image" && error && error.name === "TypeError") {
                message = "无法读取原图，请刷新页面后重试";
              }
              showEagleToast_eagle_test("保存到 Eagle 失败：" + message, 8000);
            } finally {
              saveButton.disabled = false;
            }
          });
        }
        if (!hostDoc_eagle_test.getElementById("lashforge-eagle-toast")) {
          const toast = hostDoc_eagle_test.createElement("div");
          toast.id = "lashforge-eagle-toast";
          uiHost.appendChild(toast);
        }

      function showEagleToast_eagle_test(message, duration = 1800) {
        ensureEagleUi_eagle_test();
        const toast = hostDoc_eagle_test.getElementById("lashforge-eagle-toast");
        if (!toast) return;
        const viewer = hostDoc_eagle_test.getElementById("lashforge-fullscreen-viewer");
        const dialog = window.frameElement && window.frameElement.closest('dialog, [role="dialog"]');
        const toastHost = viewer && viewer.classList.contains("active") ? viewer : (dialog || hostDoc_eagle_test.body);
        if (toast.parentElement !== toastHost) toastHost.appendChild(toast);
        toast.inert = false;
        toast.removeAttribute("inert");
        toast.textContent = String(message || "");
        toast.style.opacity = "1";
        hostWindow_eagle_test.clearTimeout(hostWindow_eagle_test.__lashforgeEagleToastTimer);
        hostWindow_eagle_test.__lashforgeEagleToastTimer = hostWindow_eagle_test.setTimeout(() => {
          toast.style.opacity = "0";
        }, duration);
      }

      function openEagleMenu_eagle_test(event, src, index) {
        ensureEagleUi_eagle_test();
        const menu = hostDoc_eagle_test.getElementById("lashforge-eagle-menu");
        if (!menu) return;
        // A modal dialog is in the browser's top layer. A menu on body is
        // inert behind it, regardless of z-index. Keep it with its target.
        const viewer = hostDoc_eagle_test.getElementById("lashforge-fullscreen-viewer");
        const frame = window.frameElement;
        const dialog = frame && frame.closest('dialog, [role="dialog"]');
        const menuHost = viewer && viewer.classList.contains("active")
          ? viewer : (dialog || hostDoc_eagle_test.body);
        if (menu.parentElement !== menuHost) menuHost.appendChild(menu);
        menu.inert = false;
        menu.removeAttribute("inert");
        const normalizedSrc = normalizeViewerSrc_eagle_test(src);
        hostWindow_eagle_test.__lashforgeEagleMenuState = {
          src: normalizedSrc,
          name: deriveEagleFileName_eagle_test(normalizedSrc, index)
        };
        const menuWidth = 168;
        const menuHeight = 126;
        const maxLeft = Math.max((hostWindow_eagle_test.innerWidth || 0) - menuWidth - 12, 12);
        const maxTop = Math.max((hostWindow_eagle_test.innerHeight || 0) - menuHeight - 12, 12);
        menu.style.left = Math.min(Math.max(event.clientX, 12), maxLeft) + "px";
        menu.style.top = Math.min(Math.max(event.clientY, 12), maxTop) + "px";
        menu.style.display = "block";
      }

        if (!hostDoc_eagle_test.getElementById("lashforge-fullscreen-viewer")) {
          const overlay = hostDoc_eagle_test.createElement("div");
          overlay.id = "lashforge-fullscreen-viewer";
          overlay.innerHTML = '<button id="lashforge-fullscreen-download" type="button">下载原图</button><button id="lashforge-fullscreen-close" type="button" aria-label="关闭预览" title="关闭">×</button><img id="lashforge-fullscreen-image" src="" alt="preview" />';
          const activeDialog = window.frameElement && window.frameElement.closest('dialog, [role="dialog"]');

          const state = {
            scale: 1,
            offsetX: 0,
            offsetY: 0,
            dragging: false,
            dragStartX: 0,
            dragStartY: 0,
            dragOriginX: 0,

          };
          const resetTransform = () => {
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;
            state.dragging = false;
            image.classList.remove("dragging");
            applyTransform();
          };
          const closeOverlay = () => {
            // A captured pointer can otherwise keep the image as the active
            // target and make the close button/overlay appear unresponsive.
            if (state.pointerId !== null && image.releasePointerCapture) {

              event.preventDefault();

      function openFullscreen_eagle_test(src, index = 0) {
        ensureOverlay_eagle_test();
        const previousMenu = hostDoc_eagle_test.getElementById("lashforge-eagle-menu");
        if (previousMenu) previousMenu.style.display = "none";
        const overlay = hostDoc_eagle_test.getElementById("lashforge-fullscreen-viewer");
        // Keep the viewer inside the active history dialog so its modal
        // backdrop and focus trap do not cover or disable the preview.
        let viewerHost = hostDoc_eagle_test.body;
        try {
          const frame = window.frameElement;
          const dialog = frame && frame.closest('dialog, [role="dialog"]');
          if (dialog) viewerHost = dialog;
        } catch (e) {}
        if (overlay.parentElement !== viewerHost) viewerHost.appendChild(overlay);
        // Modal managers can leave body-mounted UI inert after it is moved.
        // Only clear this component's owned nodes, never the page backdrop.
        overlay.inert = false;
        overlay.removeAttribute("inert");
        const image = hostDoc_eagle_test.getElementById("lashforge-fullscreen-image");
        const state = hostWindow_eagle_test.__lashforgeFullscreenState;
        image.src = normalizeViewerSrc_eagle_test(src);
        // Rebind the shared viewer on every open, including its originating
        // gallery and image index. Never retain the first card's download name.
        const downloadSrc = image.src;
        const downloadName = deriveEagleFileName_eagle_test(downloadSrc, index);
        image.oncontextmenu = (event) => {
          if (!true) { event.preventDefault(); return; }
          // Eagle's official browser extension uses Alt + right-click.
          if (event.altKey) return;
          event.preventDefault();
          openEagleMenu_eagle_test(event, downloadSrc, index);
        };
        let downloadButton = overlay.querySelector("#lashforge-fullscreen-download");
        if (!downloadButton) {
          downloadButton = hostDoc_eagle_test.createElement("button");
          downloadButton.id = "lashforge-fullscreen-download";
          downloadButton.type = "button";
          downloadButton.textContent = "下载原图";
          overlay.prepend(downloadButton);
        }
        downloadButton.hidden = !true;
        downloadButton.onclick = () => downloadOriginal_eagle_test(downloadSrc, downloadName);
        state.scale = 1;
        state.offsetX = 0;
        state.offsetY = 0;
        state.dragging = false;
        image.classList.remove("dragging");
        image.style.transform = "translate(0px, 0px) scale(1)";
        overlay.classList.add("active");
      }

        const deleteToken = "";
        if (!deleteToken) return "";

        currentUrl.searchParams.set("delete", deleteToken);
