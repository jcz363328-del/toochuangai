<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>搜索词表格设计对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; color: #1f2937; background: #eef2f7; font: 13px Inter, system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      figure { margin: 0; padding: 14px; border: 1px solid #dbe2ea; border-radius: 12px; background: white; }
      figcaption { margin-bottom: 10px; font-weight: 700; }
      img { width: 100%; height: auto; display: block; border: 1px solid #edf0f3; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>原始界面参考</figcaption><img src="./search-term-reference.png" alt="原始搜索词双栏表格" /></figure>
      <figure><figcaption>新增指标与建议底色后的实现</figcaption><img src="./search-term-implementation.png" alt="更新后的搜索词全宽表格" /></figure>
    </main>
  </body>
</html>
