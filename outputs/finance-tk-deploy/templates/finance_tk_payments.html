<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TK付款 - 财务部</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182033;font:14px 'Microsoft YaHei',sans-serif}main{max-width:1600px;padding:24px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:22px}section{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:22px;margin-top:18px}p{color:#64748b}form{display:flex;gap:14px;flex-wrap:wrap;align-items:center}label{display:flex;gap:8px;align-items:center}input{padding:8px;border:1px solid #cbd5e1;border-radius:6px}button,.back{background:#4f6df5;color:white;border:0;border-radius:7px;padding:10px 18px;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}.scroll{overflow:auto;margin-top:18px}table{border-collapse:collapse;white-space:nowrap;width:100%}td,th{padding:11px;text-align:left;border-bottom:1px solid #e2e8f0}th{background:#f8fafc}td.note{white-space:pre-wrap;min-width:180px;max-width:320px;overflow-wrap:anywhere}.error{color:#b91c1c}#message{margin-top:16px}a{color:#405de6}
</style></head><body><main><header><h1>TK付款</h1><a class="back" href="{{ url_for('finance_modules') }}">返回财务部</a></header>
<section><p>按申请日期查询青岛BD付款记录。点击“查看截图”打开付款凭证。</p>
<form id="query"><label>开始日期<input type="date" name="start_date" required></label><label>结束日期<input type="date" name="end_date" required></label><label><input type="checkbox" name="unpaid" value="1">只看未付款</label><label><input type="checkbox" name="mine" value="1">只看本人申请</label><button>查询</button></form>
<div id="message" role="status"></div><div class="scroll"><table><thead><tr><th>ID</th><th>合作ID</th><th>申请人</th><th>申请时间</th><th>网红名</th><th>收款账号</th><th>付费金额</th><th>店</th><th>备注</th><th>序号</th><th>付款单号</th><th>付款人</th><th>付款时间</th><th>付款备注</th><th>付款截图</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script>
const now=new Date(),prefix=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
document.querySelector('[name=start_date]').value=prefix+'-01';document.querySelector('[name=end_date]').value=prefix+'-'+String(now.getDate()).padStart(2,'0');
document.getElementById('query').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),message=document.getElementById('message'),body=document.getElementById('rows');button.disabled=true;message.className='';message.textContent='正在查询…';body.replaceChildren();try{const params=new URLSearchParams(new FormData(form));if(params.get('start_date')>params.get('end_date'))throw Error('开始日期不能晚于结束日期');const response=await fetch('/api/finance/tk_payments?'+params);if(!response.headers.get('content-type')?.includes('application/json'))throw Error('登录已过期或服务不可用，请刷新页面');const result=await response.json();if(!response.ok||!result.success)throw Error(result.message||'查询失败');const fragment=document.createDocumentFragment();for(const row of result.data){const tr=document.createElement('tr');row.slice(0,14).forEach((value,index)=>{const td=document.createElement('td');td.textContent=value??'';if(index===8||index===13)td.className='note';tr.appendChild(td);});const td=document.createElement('td');if(row[14]){const a=document.createElement('a');a.textContent='查看截图';a.href='/api/finance/tk_payments/'+encodeURIComponent(row[0])+'/screenshot';a.target='_blank';a.rel='noopener';td.appendChild(a);}else td.textContent='无截图';tr.appendChild(td);fragment.appendChild(tr);}body.appendChild(fragment);message.textContent=result.data.length?`共 ${result.data.length} 条`:'所选条件没有付款记录';}catch(error){message.className='error';message.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
