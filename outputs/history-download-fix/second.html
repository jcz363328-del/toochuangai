      function normalizeViewerSrc_second(src) {
        const raw = String(src || "").trim();
        if (!raw || raw.startsWith("data:")) {
          return raw;
        }
        try {
          const parsed = new URL(raw, hostWindow_second.location.href);
          const isStaticImageRoute =
            parsed.pathname.startsWith("/history_images/") ||
            parsed.pathname.startsWith("/jimeng_uploads/");
          if (!isStaticImageRoute) {
            return parsed.toString();
          }
          const currentProtocol = hostWindow_second.location.protocol || parsed.protocol;
          const currentHostname = hostWindow_second.location.hostname || parsed.hostname;
          const currentPort = parsed.port ? ":" + parsed.port : "";
          return `${currentProtocol}//${currentHostname}${currentPort}${parsed.pathname}${parsed.search}${parsed.hash}`;
        } catch (e) {
          return raw;
        }
      }

      function deriveEagleFileName_second(src, index) {
        const fallbackName = "second_" + String(index + 1) + ".png";
        const configuredName = String(
          (images_second[index] && images_second[index].download_name) || ""
        ).trim();
        if (configuredName) return configuredName;
        const raw = String(src || "").trim();
        if (!raw) return fallbackName;
        if (raw.startsWith("data:")) return fallbackName;
        try {
          const parsed = new URL(raw, hostWindow_second.location.href);
          const baseName = decodeURIComponent((parsed.pathname || "").split("/").pop() || "").trim();
          return baseName || fallbackName;
        } catch (e) {
          return fallbackName;
        }
      }

        // inert behind it, regardless of z-index. Keep it with its target.
        const viewer = hostDoc_second.getElementById("lashforge-fullscreen-viewer");
        const frame = window.frameElement;
        const dialog = frame && frame.closest('dialog, [role="dialog"]');
        const menuHost = viewer && viewer.classList.contains("active")
          ? viewer : (dialog || hostDoc_second.body);
        if (menu.parentElement !== menuHost) menuHost.appendChild(menu);
        const normalizedSrc = normalizeViewerSrc_second(src);
        hostWindow_second.__lashforgeEagleMenuState = {
          src: normalizedSrc,
          name: deriveEagleFileName_second(normalizedSrc, index)

          hostWindow_second.__lashforgeFullscreenState = state;

          const image = overlay.querySelector("img");
          const applyTransform = () => {
            image.style.transform =
              "translate(" + state.offsetX + "px, " + state.offsetY + "px) scale(" + state.scale + ")";
          };
          const resetTransform = () => {
            state.scale = 1;
            state.offsetX = 0;
            state.offsetY = 0;

            image.classList.remove("dragging");

          const closeOverlay = () => {
            // A captured pointer can otherwise keep the image as the active

            if (state.pointerId !== null && image.releasePointerCapture) {
              try { image.releasePointerCapture(state.pointerId); } catch (e) {}

            overlay.classList.remove("active");
            resetTransform();
            state.pointerId = null;

          const closeButton = overlay.querySelector("#lashforge-fullscreen-close");

            closeButton.addEventListener("pointerdown", (event) => {
              event.preventDefault();

              state.pointerId = null;

              image.classList.remove("dragging");

            if (event.deltaY < 0) {
              state.scale = Math.min(state.scale + 0.16, 6);

              state.scale = Math.max(state.scale - 0.16, 0.35);

          image.addEventListener("pointermove", (event) => {

            state.offsetY = state.dragOriginY + (event.clientY - state.dragStartY);

          const stopDragging = (event) => {
            if (!state.dragging) return;

            if (event && image.releasePointerCapture) {

          image.addEventListener("pointerup", stopDragging);
          image.addEventListener("pointercancel", stopDragging);

            state.dragging = false;

          });

            activeImage.style.transform = "translate(0px, 0px) scale(1)";
          };
          const closeActiveFullscreen = () => {
            const state = hostWindow_second.__lashforgeFullscreenState || {};
            if (state.pointerId !== null && activeImage.releasePointerCapture) {
              try { activeImage.releasePointerCapture(state.pointerId); } catch (e) {}
            }
            activeOverlay.classList.remove("active");
            resetActiveFullscreen();
            state.pointerId = null;
          };
          hostWindow_second.__lashforgeCloseFullscreen = closeActiveFullscreen;
          const activeCloseButton = activeOverlay.querySelector("#lashforge-fullscreen-close");
          if (activeCloseButton) {
            activeCloseButton.onpointerdown = (event) => {
              event.preventDefault();
              event.stopPropagation();
              const state = hostWindow_second.__lashforgeFullscreenState || {};
              if (state.pointerId !== null && activeImage.releasePointerCapture) {
                try { activeImage.releasePointerCapture(state.pointerId); } catch (e) {}
              }
              state.pointerId = null;
              state.dragging = false;
              activeImage.classList.remove("dragging");
              closeActiveFullscreen();
            };
            activeCloseButton.onclick = (event) => {
              event.preventDefault();
              event.stopPropagation();
              closeActiveFullscreen();
            };
          }
          activeOverlay.onclick = (event) => {
            if (event.target === activeOverlay) {
              closeActiveFullscreen();
            }
          };
          if (hostWindow_second.__lashforgeFullscreenKeyHandler) {
            try {
              hostDoc_second.removeEventListener("keydown", hostWindow_second.__lashforgeFullscreenKeyHandler, true);
            } catch (e) {}
          }
          hostWindow_second.__lashforgeFullscreenKeyHandler = (event) => {
            if (event.key === "Escape" && activeOverlay.classList.contains("active")) {
              event.preventDefault();
              event.stopImmediatePropagation();
              closeActiveFullscreen();
            }
          };
          hostDoc_second.addEventListener("keydown", hostWindow_second.__lashforgeFullscreenKeyHandler, true);
        }
      }

      function openFullscreen_second(src, index = 0) {
        ensureOverlay_second();
        const previousMenu = hostDoc_second.getElementById("lashforge-eagle-menu");
        if (previousMenu) previousMenu.style.display = "none";
        const overlay = hostDoc_second.getElementById("lashforge-fullscreen-viewer");
        // Keep the viewer inside the active history dialog so its modal
        // backdrop and focus trap do not cover or disable the preview.
        let viewerHost = hostDoc_second.body;
        try {
          const frame = window.frameElement;
          const dialog = frame && frame.closest('dialog, [role="dialog"]');
          if (dialog) viewerHost = dialog;
        } catch (e) {}
        if (overlay.parentElement !== viewerHost) viewerHost.appendChild(overlay);
        const image = hostDoc_second.getElementById("lashforge-fullscreen-image");
        const state = hostWindow_second.__lashforgeFullscreenState;
        image.src = normalizeViewerSrc_second(src);
        // Rebind the shared viewer on every open, including its originating
        // gallery and image index. Never retain the first card's download name.
        const downloadSrc = image.src;
        const downloadName = deriveEagleFileName_second(downloadSrc, index);
        image.oncontextmenu = (event) => {
          if (!true) { event.preventDefault(); return; }
          event.preventDefault();
          openEagleMenu_second(event, downloadSrc, index);
        };
        let downloadButton = overlay.querySelector("#lashforge-fullscreen-download");
        if (!downloadButton) {
          downloadButton = hostDoc_second.createElement("button");
          downloadButton.id = "lashforge-fullscreen-download";
          downloadButton.type = "button";
          downloadButton.textContent = "下载原图";
          overlay.prepend(downloadButton);
        }
        downloadButton.hidden = !true;
        downloadButton.onclick = async () => {
          try {
            const response = await hostWindow_second.fetch(downloadSrc);
            if (!response.ok) throw new Error("original unavailable");
            const blob = await response.blob();
            if (!blob.type.startsWith("image/")) throw new Error("not an image");
            const blobUrl = hostWindow_second.URL.createObjectURL(blob);
            const link = hostDoc_second.createElement("a");
            link.href = blobUrl;
            link.download = downloadName;
            overlay.appendChild(link);
            link.click();
            link.remove();
            hostWindow_second.setTimeout(() => hostWindow_second.URL.revokeObjectURL(blobUrl), 1200);
          } catch (error) {
            hostWindow_second.alert("原图下载失败，请关闭预览后重新打开再试。");
          }
        };
        state.scale = 1;
        state.offsetX = 0;
        state.offsetY = 0;
        state.dragging = false;
        image.classList.remove("dragging");
        image.style.transform = "translate(0px, 0px) scale(1)";
        overlay.classList.add("active");
      }

      function buildDeleteUrl_second() {
        const deleteToken = "";
        if (!deleteToken) return "";
        const currentUrl = new URL(hostWindow_second.location.href);
        currentUrl.searchParams.set("delete_upload", deleteToken);
        return currentUrl.toString();
      }

      images_second.forEach((item, index) => {
        const wrap = document.createElement("div");
        wrap.className = "zoom-thumb-wrap";

        const img = document.createElement("img");
        img.src = item.src;
        img.className = "zoom-thumb";
        img.onload = () => updateFrameHeight_second();
        img.onclick = () => openFullscreen_second(item.full_src || item.src, index);
        img.oncontextmenu = (event) => {
          if (!true) {
            event.preventDefault();
            showEagleToast_second("此处仅供预览，请使用页面上的 PSD 下载按钮");
            return;
          }
          event.preventDefault();
          openEagleMenu_second(event, item.full_src || item.src, index);
        };
        wrap.appendChild(img);

        if ("") {
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "zoom-thumb-delete";
          deleteButton.title = "删除当前图片";
          deleteButton.textContent = "×";
          deleteButton.addEventListener("pointerdown", (event) => {
            event.stopPropagation();
          });
          deleteButton.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            const deleteUrl = buildDeleteUrl_second();
            if (deleteUrl) {
              hostWindow_second.location.href = deleteUrl;
            }
          });
          wrap.appendChild(deleteButton);
        }

        grid_second.appendChild(wrap);
      });

      setTimeout(updateFrameHeight_second, 0);
    </script>
